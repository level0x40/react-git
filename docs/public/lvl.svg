<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background radial gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="32%" r="50%">
      <stop offset="0%" stop-color="#2a1060" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#1a0a3e" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#0d0620" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow2" cx="50%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#204080" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- LVL letter gradients (from Inkscape SVG) -->
    <linearGradient id="lvl-grad-L1" x1="38.9605" y1="50" x2="38.9605" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aaffff"/>
      <stop offset="0.33" stop-color="#aaffff"/>
      <stop offset="0.5466" stop-color="#6964ff"/>
      <stop offset="0.9" stop-color="#8010e1"/>
      <stop offset="1" stop-color="#ff96ff"/>
    </linearGradient>
    <linearGradient id="lvl-grad-V" x1="110" y1="50" x2="110" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aaffff"/>
      <stop offset="0.33" stop-color="#aaffff"/>
      <stop offset="0.5466" stop-color="#6964ff"/>
      <stop offset="0.9" stop-color="#8010e1"/>
      <stop offset="1" stop-color="#ff96ff"/>
    </linearGradient>
    <linearGradient id="lvl-grad-L2" x1="135" y1="50" x2="135" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aaffff"/>
      <stop offset="0.33" stop-color="#aaffff"/>
      <stop offset="0.5466" stop-color="#6964ff"/>
      <stop offset="0.9" stop-color="#8010e1"/>
      <stop offset="1" stop-color="#ff96ff"/>
    </linearGradient>

    <!-- LVL drop shadow filters -->
    <filter id="shadow-L1" style="color-interpolation-filters:sRGB" x="-0.092" y="-0.064" width="1.183" height="1.127">
      <feFlood result="flood" flood-opacity="1" flood-color="rgb(0,0,0)"/>
      <feGaussianBlur result="blur" in="SourceGraphic" stdDeviation="1.719"/>
      <feOffset result="offset" in="blur" dx="0" dy="0"/>
      <feComposite result="comp1" operator="in" in="flood" in2="offset"/>
      <feComposite result="comp2" operator="over" in="SourceGraphic" in2="comp1"/>
    </filter>
    <filter id="shadow-V" style="color-interpolation-filters:sRGB" x="-0.078" y="-0.072" width="1.156" height="1.144">
      <feFlood result="flood" flood-opacity="1" flood-color="rgb(0,0,0)"/>
      <feGaussianBlur result="blur" in="SourceGraphic" stdDeviation="1.953"/>
      <feOffset result="offset" in="blur" dx="0" dy="0"/>
      <feComposite result="comp1" operator="in" in="flood" in2="offset"/>
      <feComposite result="comp2" operator="over" in="SourceGraphic" in2="comp1"/>
    </filter>
    <filter id="shadow-L2" style="color-interpolation-filters:sRGB" x="-0.091" y="-0.064" width="1.183" height="1.127">
      <feFlood result="flood" flood-opacity="1" flood-color="rgb(0,0,0)"/>
      <feGaussianBlur result="blur" in="SourceGraphic" stdDeviation="1.724"/>
      <feOffset result="offset" in="blur" dx="0" dy="0"/>
      <feComposite result="comp1" operator="in" in="flood" in2="offset"/>
      <feComposite result="comp2" operator="over" in="SourceGraphic" in2="comp1"/>
    </filter>

    <!-- CRT scanline pattern -->
    <pattern id="scanlines" width="800" height="4" patternUnits="userSpaceOnUse">
      <rect width="800" height="2" y="0" fill="transparent"/>
      <rect width="800" height="2" y="2" fill="rgba(0,0,0,0.55)"/>
    </pattern>

    <!-- Mask scanlines to LVL letters + 0x40 text -->
    <mask id="text-mask">
      <g transform="translate(81.1111, -136.6667) scale(3.111111)">
        <path d="M 35.000005,49.999999 V 115 H 80.02045 L 72.623904,94.999997 H 55.000005 V 49.999999 Z" fill="white"/>
        <path d="M 60.000001,49.999998 85.000002,115 115,115 134.7697,49.999997 H 114.76969 L 100,94.999997 80.000001,49.999998 Z" fill="white"/>
        <path d="m 140.23012,50 19.76988,-10e-7 -12,44.999998 22.91844,-3e-6 V 115 L 120,115 Z" fill="white"/>
      </g>
      <use href="#subtitle-0x40" fill="white"/>
    </mask>
